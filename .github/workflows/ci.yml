# Build and test across the optimization configurations that have historically diverged.
#
# The lanes are not redundant: the context switch is hand-written assembly whose contract with
# the compiler must hold at every optimization level and under LTO (see
# docs/context_switch_core_01.md). A latent crash once shipped because only -O0 and -O3 were
# ever built — the -O2 and LTO lanes exist so codegen-sensitive regressions surface on push,
# not in a consumer's build.
#
name: ci

on:
  push:
  pull_request:

jobs:
  bazel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: debug
            config: debug
            runner: ubuntu-24.04
          - lane: release
            config: lto
            runner: ubuntu-24.04
          - lane: release-nolto
            config: release
            runner: ubuntu-24.04
          - lane: o2-nolto
            config: o2
            runner: ubuntu-24.04
          - lane: debug-arm64
            config: debug
            runner: ubuntu-24.04-arm
          - lane: release-arm64
            config: lto
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.lane }}
          repository-cache: true
      - name: Probe io_uring availability
        run: |
          sysctl kernel.io_uring_disabled 2>/dev/null || true
          uname -r
      - name: Build libraries, examples, and benchmarks
        # Ubuntu 6.8 runners need the guarded provided-buffer compatibility path.
        run: bazelisk build //... --config=${{ matrix.config }} --config=ubuntu_pbuf_workaround
      - name: Test (including concurrent repeated runs)
        run: bazelisk test //... --config=${{ matrix.config }} --config=ubuntu_pbuf_workaround --runs_per_test=3

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: debug
            cmake_args: -DCMAKE_BUILD_TYPE=Debug
          # The shipping release configuration: standalone release defaults to LTO (COOP_LTO=ON).
          - lane: release
            cmake_args: -DCMAKE_BUILD_TYPE=Release
          # Non-LTO -O3: what consumers get when they opt out (or embed coop without IPO).
          - lane: release-nolto
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCOOP_LTO=OFF
          # Plain -O2, no LTO: the codegen-fragility guard — the red-zone crash class hid here.
          - lane: o2-nolto
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG" -DCOOP_LTO=OFF
          # Native aarch64 checks exercise its assembly and weaker memory ordering.
          - lane: debug-arm64
            cmake_args: -DCMAKE_BUILD_TYPE=Debug
            runner: ubuntu-24.04-arm
          - lane: release-arm64
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # All dependencies come from Ubuntu; unrelated preinstalled package feeds must
          # not make builds depend on their availability or metadata consistency.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources
                       -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install -y liburing-dev libssl-dev gdb

      - name: Probe io_uring availability
        run: |
          # coop is io_uring-based end to end; if the runner kernel restricts io_uring the
          # suite cannot run and this step makes that failure legible instead of mysterious.
          sysctl kernel.io_uring_disabled 2>/dev/null || true
          uname -r

      - name: Configure
        # Preserve optimization and symbols; opt in to the guarded Ubuntu compatibility path.
        run: cmake -S . -B build ${{ matrix.cmake_args }} -DCMAKE_CXX_FLAGS=-g -DCOOP_WORKAROUND_UBUNTU_PBUF_RESERVED_CHECK=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: |
          ./build/bin/coop_context_switch_tests
          ./build/bin/coop_http_parser_tests
          ./build/bin/coop_tls_config_tests
          ./build/bin/coop_http_server_parser_tests
          ./build/bin/coop_ws_parser_tests
          ./build/bin/coop_dns_parser_tests
          # Preserve native execution and its exit status; inspect a core only after failure.
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern="$PWD/build/core.%p"
          status=0
          # Abort hangs early enough to inspect their core before the job-wide timeout.
          timeout --verbose --signal=ABRT --kill-after=15s 5m ./build/bin/coop_tests || status=$?
          if [ "$status" -ne 0 ]; then
            for core in build/core.*; do
              [ -f "$core" ] || continue
              gdb --batch ./build/bin/coop_tests "$core" \
                -ex 'set pagination off' \
                -ex 'p $_siginfo' \
                -ex 'thread apply all bt' \
                -ex 'info registers' \
                -ex 'source tools/coop_gdb.py' \
                -ex 'coop contexts' \
                -ex 'coop bt all' || true
            done
          fi
          exit "$status"

      - name: GDB live and core inspection
        if: matrix.lane == 'debug'
        run: |
          python3 tests/gdb_smoke.py build/bin/coop_gdb_fixture --bare
          python3 tests/gdb_smoke.py build/bin/coop_gdb_fixture
